name: Automated Tests

on: pull_request

jobs:
  jest:
    name: Jest Ubuntu
    env:
      CI_SUDO_REQUIRED: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - run: npm ci
      - run: npm test
